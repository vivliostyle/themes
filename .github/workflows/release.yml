name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write # Required for npm trusted publishing (OIDC)
  contents: write # For tags and releases
  pull-requests: write # For creating version PRs

env:
  HUSKY: 0

jobs:
  publish-dry-run:
    runs-on: ubuntu-latest
    outputs:
      publish-summary: ${{ steps.publish-summary.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:tools
      - name: Release dry run
        env:
          PUBLISH_BRANCH: ${{ github.ref_name }}
        run: pnpm publish -r --dry-run --report-summary --publish-branch "$PUBLISH_BRANCH"
      - name: Output publish summary
        id: publish-summary
        run: echo "json=$(jq -c . pnpm-publish-summary.json)" >> "$GITHUB_OUTPUT"

  create-version-pr:
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: pnpm run bump

  publish:
    needs:
      - publish-dry-run
      - create-version-pr
    # Publish only once the version PR has been merged: the dry run found
    # something to publish and no changeset is left unconsumed.
    if: ${{ fromJson(needs.publish-dry-run.outputs.publish-summary).publishedPackages[0] && !fromJson(needs.create-version-pr.outputs.has-changesets) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          registry-url: 'https://registry.npmjs.org/'
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:tools
      - name: Release
        env:
          PUBLISH_BRANCH: ${{ github.ref_name }}
        run: pnpm publish -r --access public --publish-branch "$PUBLISH_BRANCH"

  release:
    needs:
      - publish-dry-run
      - publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.publish-dry-run.outputs.publish-summary).publishedPackages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Output release notes
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_VERSION: ${{ matrix.package.version }}
        run: |
          package_path=$(pnpm ls --filter "$PACKAGE_NAME" --json | jq -r '.[0].path')
          changelog_file="$package_path/CHANGELOG.md"
          if [ -f "$changelog_file" ]; then
            version=$(echo "$PACKAGE_VERSION" | sed 's/\./\\./g')
            awk "/^## $version/ {flag=1; next} /^##? / {flag=0} flag {print}" "$changelog_file" > release_notes.txt
          else
            touch release_notes.txt
          fi
          cat release_notes.txt
      - name: Create tag
        id: create-tag
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_VERSION: ${{ matrix.package.version }}
        run: |
          name="$PACKAGE_NAME@$PACKAGE_VERSION"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          git tag -a "$name" -m "Release $name"
          git push origin "$name"
      - name: Release to GitHub
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.create-tag.outputs.name }}
          name: ${{ steps.create-tag.outputs.name }}
          body_path: release_notes.txt
          token: ${{ secrets.GITHUB_TOKEN }}
