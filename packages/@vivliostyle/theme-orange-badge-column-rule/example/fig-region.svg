<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" role="img" aria-label="ヴェルミリオ近郊の広域図。鉄道・バス路線と連絡船の航路、近郊3町の位置を番号ピンで示す。">
<style>
.r-base { fill: #e7dcc4; }
