<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="ヴェルミリオ市内交通の概念図。トラム3系統と水上バス航路、主要停留所を番号ピンで示す。">
<style>
.t-base { fill: #e7dcc4; }
.t-water { fill: #a9d3e0; }
.t-line { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.t-l1 { stroke: #d76b3f; }
.t-l2 { stroke: #8fb2ab; }
.t-l3 { stroke: #e2a24c; }
.t-boat { fill: none; stroke: #4b8ba1; stroke-width: 3.4; stroke-linecap: round; stroke-dasharray: 9 7; }
.t-stop { fill: #f6f1e6; stroke: #b98e5a; stroke-width: 2; }
.t-pin { fill: #ff6600; }
.t-pin-txt {
  fill: #fff;
  font-family: "Barlow Condensed", Helvetica, Arial, sans-serif;
  font-weight: 700;
  font-size: 13px;
  text-anchor: middle;
}
</style>

<rect class="t-base" width="300" height="200" />
<path class="t-water" d="M0,148 C54,143 104,157 152,170 C196,182 248,186 300,181 L300,200 L0,200 Z" />

<path class="t-line t-l1" d="M22,42 H128 L170,84 H282" />
<path class="t-line t-l2" d="M22,118 H72 L134,56 H282" />
<path class="t-line t-l3" d="M96,16 V70 L146,120 H258" />
<path class="t-boat" d="M30,178 C92,166 146,192 214,174 C244,166 266,166 286,171" />

<g class="t-stop">
  <circle cx="60" cy="42" r="4.4" />
  <circle cx="128" cy="42" r="4.4" />
  <circle cx="228" cy="84" r="4.4" />
  <circle cx="72" cy="118" r="4.4" />
  <circle cx="180" cy="56" r="4.4" />
  <circle cx="240" cy="56" r="4.4" />
  <circle cx="96" cy="40" r="4.4" />
  <circle cx="204" cy="120" r="4.4" />
  <circle cx="250" cy="120" r="4.4" />
</g>

<g>
  <circle class="t-pin" cx="34" cy="42" r="11" />
  <text class="t-pin-txt" x="34" y="46.6">1</text>
  <circle class="t-pin" cx="170" cy="84" r="11" />
  <text class="t-pin-txt" x="170" y="88.6">2</text>
  <circle class="t-pin" cx="134" cy="56" r="11" />
  <text class="t-pin-txt" x="134" y="60.6">3</text>
  <circle class="t-pin" cx="110" cy="177" r="11" />
  <text class="t-pin-txt" x="110" y="181.6">4</text>
</g>
</svg>
