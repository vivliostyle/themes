    _syntax: '*'
    _property: 'font-family'
    _define: 'sans-serif'
  font-feature-settings:
    _syntax: '*'
    _property: 'font-feature-settings'
    _define: 'normal'
  font-kerning:
    _syntax: 'auto | none | normal'
    _property: 'font-kerning'
    _define: 'auto'
  font-size:
    _syntax: 'large | larger | math | medium | small | smaller | x-large | x-small | xx-large | xx-small | xxx-large | <length-percentage>'
    _property: 'font-size'
    _define: '100%'
  font-stretch:
    _syntax: 'condensed | expanded | extra-condensed | extra-expanded | normal | semi-condensed | semi-expanded | ultra-condensed | ultra-expanded | <percentage>'
    _property: 'font-stretch'
    _define: 'normal'
  font-style:
    _syntax: 'italic | normal | oblique | <angle>'
    _property: 'font-style'
    _define: 'normal'
  font-synthesis:
    _syntax: '*'
    _property: 'font-synthesis'
    _define: 'weight style small-caps'
  font-variant:
    _syntax: '*'
    _property: 'font-variant'
    _define: 'normal'
  font-variation-settings:
    _syntax: '*'
    _property: 'font-variation-settings'
    _define: 'normal'
  font-weight:
    _syntax: 'bold | bolder | lighter | normal | <number>'
    _property: 'font-weight'
    _define: '400'
  font-weight-bold:
    _syntax: '*'
    _define: '700'
  hanging-punctuation:
    _syntax: '*'
    _property: 'hanging-punctuation'
    _define: 'none'
  hyphens:
    _syntax: 'auto | manual | none'
    _property: 'hyphens'
    _define: 'auto'
  letter-spacing:
    _syntax: 'normal | <length-percentage>'
    _property: 'letter-spacing'
    _define: '0'
  line-break:
    _syntax: 'anywhere | auto | loose | normal | strict'
    _property: 'line-break'
    _define: 'strict'
  line-height:
    _syntax: 'normal | <length> | <number> | <percentage>'
    _property: 'line-height'
    _define: '1.5'
  orphans:
    _syntax: '<integer>'
    _property: 'orphans'
    _define: 'var(--vs-widows-orphans)'
  overflow-wrap:
    _syntax: 'anywhere | break-word | normal'
    _property: 'overflow-wrap'
    _define: 'anywhere'
  spacing-inline-indent:
    _syntax: '*'
    _define: 'min(2ch, 5vw)'
  spacing-rlh:
    _syntax: '*'
    _define: 'calc(var(--vs-line-height) * 1rem)'
  tab-size:
    _syntax: '<integer> | <length>'
    _property: 'tab-size'
    _define: '4'
  text-align:
    _syntax: 'center | end | justify | left | match-parent | right | start'
    _property: 'text-align'
    _define: 'start'
