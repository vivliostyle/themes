  marker-tbl-margin-inline:
    _syntax: '*'
    _property: 'margin-inline'
  root-counter-reset:
    _syntax: '*'
    _property: 'counter-reset'
    _define: 'vs-counter-fig var(--vs-crossref--root-counter-fig,) vs-counter-tbl var(--vs-crossref--root-counter-tbl,) vs-counter-cite var(--vs-crossref--root-counter-cite,)'
