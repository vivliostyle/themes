crossref:
  anchor-text-decoration:
    _syntax: '*'
    _property: 'text-decoration'
    _define:
      - value: 'none'
      - media: '(hover: hover)'
        selector: 'a:is([data-ref="fig"],a[data-ref="tbl"],a[data-ref="cite"]):hover'
        value: 'underline'
  call-cite-content:
    _syntax: '*'
    _property: 'content'
    _define:
      - value: "'[' target-counter(attr(href), vs-counter-cite) ']'"
      - media: 'screen'
        value: "'[???]'"
  call-display:
    _syntax: '*'
    _property: 'display'
    _define: 'inline'
  call-fig-content:
    _syntax: '*'
    _property: 'content'
    _define:
      - value: "'Figure ' target-counter( attr(href), vs-counter-fig, var(--vs-crossref--counter-style) )"
      - selector: ':root:lang(ja)'
        value: "'図' target-counter( attr(href), vs-counter-fig, var(--vs-crossref--counter-style) )"
      - media: 'screen'
        value: "'Figure ???'"
      - media: 'screen'
        selector: ':root:lang(ja)'
        value: "'図???'"
  call-margin-inline:
    _syntax: '*'
    _property: 'margin-inline'
    _define: '0'
  call-tbl-content:
    _syntax: '*'
    _property: 'content'
    _define:
      - value: "'Table ' target-counter( attr(href), vs-counter-tbl, var(--vs-crossref--counter-style) )"
      - selector: ':root:lang(ja)'
        value: "'表' target-counter( attr(href), vs-counter-tbl, var(--vs-crossref--counter-style) )"
      - media: 'screen'
        value: "'Table ???'"
      - media: 'screen'
        selector: ':root:lang(ja)'
        value: "'表???'"
  counter-style:
    _syntax: '*'
    _define: 'decimal'
  marker-cite-content:
    _syntax: '*'
    _property: 'content'
    _define: "'[' counter(vs-counter-cite) ']'"
  marker-cite-margin-inline:
    _syntax: '*'
    _property: 'margin-inline'
  marker-display:
    _syntax: '*'
    _property: 'display'
    _define: 'inline'
  marker-fig-content:
    _syntax: '*'
    _property: 'content'
    _define:
      - value: "'Figure ' counter(vs-counter-fig, var(--vs-crossref--counter-style)) ': '"
      - selector: ':root:lang(ja)'
        value: "'図' counter(vs-counter-fig, var(--vs-crossref--counter-style)) ': '"
  marker-fig-margin-inline:
