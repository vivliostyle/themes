<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 165" width="450" height="165" role="img" aria-label="Discharge characteristic curves at 23 degrees Celsius. The horizontal axis is duration in hours on a logarithmic scale from 1 to 10000. The vertical axis is voltage from 1.0 to 3.5 volts. Three continuous drains are plotted. At 3 milliamps the plateau sits near 2.8 volts and falls through 2.0 volts at about 100 hours. At 1 milliamp the plateau sits near 2.9 volts and falls through 2.0 volts at about 330 hours. At 0.2 milliamps the plateau sits near 3.0 volts and falls through 2.0 volts at about 1700 hours." fill="none" stroke="#111111">
