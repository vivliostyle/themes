<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 152" role="img" aria-labelledby="fig2-title fig2-desc">
<title id="fig2-title">セグメント別 売上高（連結）</title>
<desc id="fig2-desc">セグメント別の連結売上高を当第1四半期と前第1四半期で比較した横棒グラフ。単位は百万円。精密機器事業は当第1四半期26,500、前第1四半期22,900。計測システム事業は13,900と12,700。その他は2,400と2,400。</desc>
