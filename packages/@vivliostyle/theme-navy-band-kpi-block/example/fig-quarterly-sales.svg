  font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
}
.unit,
.scale {
  font-size: 9px;
  fill: #57606a;
}
.value {
  /* 画像として読み込まれる SVG ではローカルフォントの中太が weight 500 で
     拾われないため、ファミリ名でも Medium を指定する */
  font-family: "Roboto Medium", "Roboto", "Helvetica Neue", Arial, sans-serif;
  font-size: 8.5px;
  font-weight: 500;
  text-anchor: middle;
}
.value.prev {
  fill: #57606a;
}
.value.now {
  fill: #174ea6;
}
.value.est {
  fill: #1a73e8;
}
.period {
  font-size: 9.5px;
  fill: #1f2328;
  text-anchor: middle;
}
</style>
