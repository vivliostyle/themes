<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">四半期別 売上高（連結）</title>
<desc id="fig-desc">四半期別の連結売上高を2026年3月期と2025年3月期で比較した棒グラフ。単位は億円。2026年3月期は1Qが実績428、2Q以降は予想で2Qが440、3Qが448、4Qが464。2025年3月期は実績で1Qが380、2Qが412、3Qが431、4Qが455。</desc>
<style>
