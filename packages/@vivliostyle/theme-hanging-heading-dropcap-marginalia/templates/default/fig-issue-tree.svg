<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" role="img" aria-label="収益性の低下を売上総利益率の低下と販管費率の上昇に分け、さらにそれぞれの要因へ展開したロジックツリー">
<style>
text { font-family: "Noto Serif JP", "Hiragino Mincho ProN", serif; font-size: 24px; fill: #2b2520; }
text.leaf { font-size: 22px; }
</style>
<rect x="230" y="2" width="180" height="56" rx="28" ry="28" fill="none" stroke="#5a4a42" stroke-width="2.2" />
<path d="M320 58 V80" fill="none" stroke="#5a4a42" stroke-width="2.4" />
<path d="M160 80 H480" fill="none" stroke="#5a4a42" stroke-width="2.4" />
<path d="M160 80 V104" fill="none" stroke="#5a4a42" stroke-width="2.4" />
<path d="M480 80 V104" fill="none" stroke="#5a4a42" stroke-width="2.4" />
<rect x="15" y="104" width="290" height="56" rx="28" ry="28" fill="none" stroke="#5a4a42" stroke-width="2.2" />
<rect x="335" y="104" width="290" height="56" rx="28" ry="28" fill="none" stroke="#5a4a42" stroke-width="2.2" />
<path d="M160 160 V184" fill="none" stroke="#5a4a42" stroke-width="2.4" />
<path d="M480 160 V184" fill="none" stroke="#5a4a42" stroke-width="2.4" />
<rect x="15" y="184" width="290" height="118" rx="10" ry="10" fill="none" stroke="#8a7a70" stroke-width="1.6" />
<rect x="335" y="184" width="290" height="118" rx="10" ry="10" fill="none" stroke="#8a7a70" stroke-width="1.6" />
<text x="320" y="39" text-anchor="middle">収益性の低下</text>
<text x="160" y="141" text-anchor="middle">売上総利益率の低下</text>
<text x="480" y="141" text-anchor="middle">販管費率の上昇</text>
<text class="leaf" x="34" y="217">・原材料単価の上昇</text>
<text class="leaf" x="34" y="255">・歩留まりの低下</text>
<text class="leaf" x="34" y="293">・製品構成の変化</text>
<text class="leaf" x="354" y="217">・物流費の増加</text>
<text class="leaf" x="354" y="255">・採用・教育費の増加</text>
<text class="leaf" x="354" y="293">・外注委託費の増加</text>
</svg>
