<text x="39" y="253">0.01</text>
</g>
<text class="axtitle" x="20" y="20">THD (%)</text>

<g class="xlab">
<text x="44" y="264">60</text>
<text x="112" y="264">70</text>
<text x="181" y="264">80</text>
<text x="249" y="264">90</text>
<text x="318" y="264">100</text>
<text x="386" y="264">110</text>
</g>
<text class="axtitle" x="215" y="284" text-anchor="middle">出力音圧レベル (dB SPL)</text>
</svg>
