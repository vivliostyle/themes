<polyline class="c30" points="44,134.8 61.1,139.2 78.2,143.5 95.3,147.8 112.4,152.2 129.5,156 146.6,159.9 163.7,163.7 180.8,167.6 197.9,169.7 215,171.9 232.1,174 249.2,172.5 266.3,170 283.4,167.6 300.5,161.1 317.6,154.7 334.7,147.1 351.8,138.6 368.9,126.7" />

<g class="legend">
<rect x="52" y="188" width="132" height="58" />
<line class="c0" x1="62" y1="203" x2="92" y2="203" />
<text x="100" y="206">100Hz</text>
<line class="c15" x1="62" y1="220" x2="92" y2="220" />
