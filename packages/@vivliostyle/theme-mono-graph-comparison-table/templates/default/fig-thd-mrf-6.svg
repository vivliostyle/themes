<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" role="img" aria-label="高調波歪率グラフ。横軸は60から110dB SPLの出力音圧レベル、縦軸は0.01から10パーセントの対数目盛。100Hz・1kHz・10kHzの3曲線がU字を描き、中域で最小値をとったのち高出力側で再び上昇する。">
<style>
.grid-h line, .grid-v line { stroke: #1a1a1a; stroke-width: 0.4; stroke-dasharray: 1 2.4; }
.grid-hm line { stroke: #9a9a9a; stroke-width: 0.3; stroke-dasharray: 1 2.4; }
.frame { fill: none; stroke: #1a1a1a; stroke-width: 0.8; }
.c0 { fill: none; stroke: #1a1a1a; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.c15 { fill: none; stroke: #1a1a1a; stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 6 3.5; }
.c30 { fill: none; stroke: #1a1a1a; stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1.4 2.6; }
.legend rect { fill: #ffffff; stroke: #1a1a1a; stroke-width: 0.5; }
.legend text { font-family: "Noto Sans JP", sans-serif; font-weight: 400; font-size: 12px; fill: #1a1a1a; }
.ylab text, .xlab text { font-family: "IBM Plex Mono", monospace; font-size: 12px; fill: #1a1a1a; }
.ylab text { text-anchor: end; }
.xlab text { text-anchor: middle; }
.axtitle { font-family: "Noto Sans JP", sans-serif; font-weight: 400; font-size: 12px; fill: #1a1a1a; }
</style>

<g class="grid-hm">
<line x1="44" y1="50" x2="386" y2="50" />
<line x1="44" y1="67" x2="386" y2="67" />
<line x1="44" y1="80" x2="386" y2="80" />
<line x1="44" y1="124" x2="386" y2="124" />
<line x1="44" y1="141" x2="386" y2="141" />
<line x1="44" y1="154" x2="386" y2="154" />
<line x1="44" y1="198" x2="386" y2="198" />
<line x1="44" y1="215" x2="386" y2="215" />
<line x1="44" y1="228" x2="386" y2="228" />
</g>
<g class="grid-h">
<line x1="44" y1="28" x2="386" y2="28" />
<line x1="44" y1="102" x2="386" y2="102" />
<line x1="44" y1="176" x2="386" y2="176" />
<line x1="44" y1="250" x2="386" y2="250" />
</g>
<g class="grid-v">
<line x1="44" y1="28" x2="44" y2="250" />
<line x1="112" y1="28" x2="112" y2="250" />
<line x1="181" y1="28" x2="181" y2="250" />
<line x1="249" y1="28" x2="249" y2="250" />
<line x1="318" y1="28" x2="318" y2="250" />
<line x1="386" y1="28" x2="386" y2="250" />
</g>
<rect class="frame" x="44" y="28" width="342" height="222" />

<polyline class="c0" points="44,119.5 61.1,122.1 78.2,124.7 95.3,127.3 112.4,129.9 129.5,132 146.6,134.1 163.7,136.2 180.8,135.8 197.9,134.7 215,133.5 232.1,129.2 249.2,122.6 266.3,115.1 283.4,103.8 300.5,92.1 317.6,78.6 334.7,65.1 351.8,51.6" />
