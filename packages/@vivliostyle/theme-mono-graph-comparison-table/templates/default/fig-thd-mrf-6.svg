<polyline class="c30" points="44,140.7 61.1,144.8 78.2,148.9 95.3,153 112.4,157.1 129.5,161.8 146.6,166.6 163.7,171.3 180.8,176 197.9,178 215,180 232.1,182 249.2,180.3 266.3,177.6 283.4,173 300.5,165.4 317.6,156.1 334.7,144 351.8,131.4" />

<g class="legend">
<rect x="52" y="188" width="132" height="58" />
<line class="c0" x1="62" y1="203" x2="92" y2="203" />
<text x="100" y="206">100Hz</text>
<line class="c15" x1="62" y1="220" x2="92" y2="220" />
