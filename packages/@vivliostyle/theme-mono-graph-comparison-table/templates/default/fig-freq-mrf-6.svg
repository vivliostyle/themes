<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" role="img" aria-label="周波数特性グラフ。横軸は20Hzから20kHzの対数目盛、縦軸は50から100dB。軸上0度・15度・30度の3曲線が低域から立ち上がり、中高域で84dB前後を保ちつつ緩やかにうねり、高域で角度が開くほど早くロールオフする。">
