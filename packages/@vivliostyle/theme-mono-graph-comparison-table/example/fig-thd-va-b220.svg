<polyline class="c30" points="44,139.6 61.1,143.6 78.2,147.5 95.3,151.4 112.4,155.4 129.5,159.8 146.6,164.2 163.7,168.5 180.8,172.9 197.9,175.2 215,177.4 232.1,179.7 249.2,178.2 266.3,175.9 283.4,171.3 300.5,163.3 317.6,155.4 334.7,144.3 351.8,132.1 368.9,118.1" />

<g class="legend">
<rect x="52" y="188" width="132" height="58" />
