<line x1="318" y1="28" x2="318" y2="250" />
<line x1="386" y1="28" x2="386" y2="250" />
</g>
<rect class="frame" x="44" y="28" width="342" height="222" />

<polyline class="c0" points="44,127 61.1,129.4 78.2,131.8 95.3,134.2 112.4,136.7 129.5,138.5 146.6,140.4 163.7,142.2 180.8,144.1 197.9,145.1 215,146.1 232.1,145.1 249.2,142.6 266.3,139.2 283.4,131.9 300.5,124.5 317.6,114 334.7,102.7 351.8,90.4 368.9,77.8" />
