.ylab text, .xlab text { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; fill: #1a1a1a; }
.ylab text { text-anchor: end; }
.xlab text { text-anchor: middle; }
.axtitle { font-family: "Noto Sans JP", sans-serif; font-weight: 400; font-size: 12.5px; fill: #1a1a1a; }
