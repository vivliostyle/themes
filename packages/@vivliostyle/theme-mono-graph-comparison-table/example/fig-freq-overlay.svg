<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" role="img" aria-label="3機種の軸上周波数特性を重ねたグラフ。横軸は20Hzから20kHzの対数目盛、縦軸は50から100dB。KRH-207が最も高い能率と低域の伸びを示し、VA-B220が中庸、MRF-6は能率が低く低域のロールオフが緩やかである。">
