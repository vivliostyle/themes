<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 235" role="img" aria-label="Typical application circuit. An antenna feeds a single-pole double-throw switch U2. The receive branch passes through SAW band-pass filter FL1 and balun T1 into the RFIN1 pin of the NSR7420 (U1); the transmit branch leaves RFOUT1 through balun T2 and low-pass filter FL2 back to the switch. A 40 MHz TCXO Y1 drives REF_IN, the exposed pad is grounded, and 3.3 V and 1.8 V rails supply the analog and digital domains. The 12-bit parallel data port, DCLK, DFRAME, TXNRX, the four-wire SPI port and INTB connect to a baseband SoC or FPGA." fill="none" stroke="#171717" stroke-width="1">
