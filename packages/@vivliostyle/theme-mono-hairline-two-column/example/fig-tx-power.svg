<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-label="Line graph of transmitter output power versus frequency at maximum gain, VDD_A equals 3.3 volts and 25 degrees Celsius. Output power holds at 20.5 dBm from 0.3 GHz to 2 GHz, then falls gradually to 16 dBm at 6 GHz." fill="none" stroke="#171717">
<style>
text { font-family: "Roboto Mono", "IBM Plex Mono", ui-monospace, monospace; stroke: none; }
</style>
<text x="4" y="12" font-size="7.3" font-weight="500" fill="#171717" stroke="none">TRANSMITTER OUTPUT POWER vs FREQUENCY  (VDD_A = 3.3 V, TA = 25 &#176;C)</text>
