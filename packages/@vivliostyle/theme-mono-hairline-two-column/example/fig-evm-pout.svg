<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-label="Line graph of transmit error vector magnitude versus output power for a 64-QAM 100 MHz carrier at 1 GHz. EVM is about 1.25 percent between 8 and 12 dBm, 1.8 percent at 18 dBm, and rises steeply above 20 dBm, passing 3.5 percent at 20.5 dBm." fill="none" stroke="#171717">
