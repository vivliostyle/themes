<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-label="SPI read cycle timing diagram with a scale break between the fourth and thirteenth clock. CSB falls a setup time t1 before the first SCLK rising edge and rises a hold time t7 after the last falling edge. SCLK high and low times are t2 and t3. SDI carries the read/write bit and address bits and must be stable t4 before and t5 after each rising edge; SDI is a don-t-care during the data phase. SDO is high impedance during the instruction phase and presents data bits t6 after each falling edge." fill="none" stroke="#171717" stroke-width="1">
