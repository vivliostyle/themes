<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 432" role="img" aria-label="Functional block diagram of the NSR7420. The receive path runs from RF-IN through an LNA to I and Q mixers driven by a PLL synthesizer and 90-degree hybrid, then baseband low-pass filters and ADCs to the DI and DQ digital ports. The transmit path runs from the TI and TQ ports through DACs, low-pass filters, I and Q mixers and a summing node to a power amplifier at RFOUT. SPI interface, digital control and state machine, and calibration and bias blocks sit along the bottom." fill="none" stroke="#171717" stroke-width="1">
