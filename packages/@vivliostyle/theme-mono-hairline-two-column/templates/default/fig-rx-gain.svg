<line x1="187.9" y1="28" x2="187.9" y2="150" />
<line x1="241.9" y1="28" x2="241.9" y2="150" />
<line x1="296" y1="28" x2="296" y2="150" />
</g>
<rect x="42" y="28" width="308" height="122" stroke="#171717" stroke-width="0.8" />
<polyline points="42,54.4 52.8,52.4 79.8,52.4 133.9,55.3 187.9,60.7 241.9,68 296,77.8 350,90.5" stroke="#171717" stroke-width="1.2" />
<g font-size="6" fill="#555555" stroke="none" text-anchor="end">
<text x="38" y="30.2">50</text>
<text x="38" y="54.6">45</text>
<text x="38" y="79">40</text>
