<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-label="Line graph of maximum receiver gain versus frequency at VDD_A equals 3.3 volts and 25 degrees Celsius. Gain is 45 dB from 0.5 to 1 GHz, holds above 43 dB to 3 GHz, and rolls off gradually to about 37 dB at 6 GHz." fill="none" stroke="#171717">
<style>
text { font-family: "Roboto Mono", "IBM Plex Mono", ui-monospace, monospace; stroke: none; }
</style>
<text x="4" y="12" font-size="7.3" font-weight="500" fill="#171717" stroke="none">RECEIVER GAIN vs FREQUENCY  (VDD_A = 3.3 V, TA = 25 &#176;C)</text>
