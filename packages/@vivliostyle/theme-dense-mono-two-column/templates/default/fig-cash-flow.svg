<title id="fig-title">キャッシュ・フローの推移</title>
<desc id="fig-desc">キャッシュ・フローの推移を示す棒グラフ。営業活動によるキャッシュ・フローは第40期11,982百万円、第41期13,215百万円、第42期14,704百万円。投資活動によるキャッシュ・フローは第40期マイナス8,640百万円、第41期マイナス9,320百万円、第42期マイナス10,700百万円。フリー・キャッシュ・フローは第40期3,342百万円、第41期3,895百万円、第42期4,004百万円。</desc>
