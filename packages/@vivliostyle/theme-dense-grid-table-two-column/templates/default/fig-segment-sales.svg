<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -12 350 164" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">セグメント別売上高の比較</title>
<desc id="fig-desc">第41期と第42期のセグメント別売上高を比較した横棒グラフ。生活雑貨事業68,214百万円から72,480百万円、食品事業55,486百万円から58,930百万円、オンライン事業33,905百万円から41,268百万円、法人事業21,319百万円から24,627百万円。</desc>
<style>
text {
  font-family: "Noto Serif JP", "Hiragino Mincho ProN", "YuMincho", serif;
  fill: #1a1a1a;
}
/* 値ラベルが目盛線と重なるため、地色で縁取って可読性を保つ */
.val {
  paint-order: stroke;
  stroke: #f7f6f2;
  stroke-width: 2.4;
  stroke-linejoin: round;
}
</style>
<text x="0" y="-3" font-size="8.5">(百万円)</text>
<rect x="206" y="-10" width="10" height="8" fill="#b9b9b5" stroke="#2a2a2a" stroke-width="0.5" />
<text x="219" y="-3" font-size="8.5">第41期</text>
<rect x="262" y="-10" width="10" height="8" fill="#565656" stroke="#2a2a2a" stroke-width="0.5" />
<text x="275" y="-3" font-size="8.5">第42期</text>
<line x1="138" y1="4" x2="138" y2="136" stroke="#b5b5b5" stroke-width="0.6" />
<line x1="204" y1="4" x2="204" y2="136" stroke="#b5b5b5" stroke-width="0.6" />
<line x1="270" y1="4" x2="270" y2="136" stroke="#b5b5b5" stroke-width="0.6" />
<line x1="336" y1="4" x2="336" y2="136" stroke="#b5b5b5" stroke-width="0.6" />
