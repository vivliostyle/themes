<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" role="img"
     aria-label="Line engraving of the first printing house: a compositor at a slanted type case and a pressman working a wooden screw press.">
  <g fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- back wall window -->
    <rect x="24" y="24" width="70" height="58" stroke-width="1.2" />
    <line x1="59" y1="24" x2="59" y2="82" stroke-width="1" />
    <line x1="24" y1="53" x2="94" y2="53" stroke-width="1" />
    <g stroke-width="0.5">
      <line x1="30" y1="48" x2="52" y2="26" />
      <line x1="30" y1="78" x2="55" y2="53" />
      <line x1="64" y1="48" x2="88" y2="26" />
      <line x1="64" y1="78" x2="90" y2="55" />
    </g>
    <!-- drying sheets on a line -->
    <line x1="112" y1="28" x2="200" y2="24" stroke-width="0.9" />
    <g stroke-width="0.9">
      <rect x="120" y="27" width="18" height="24" />
      <rect x="150" y="26" width="18" height="24" />
      <rect x="180" y="25" width="18" height="24" />
    </g>
    <!-- compositor at slanted type case -->
    <circle cx="74" cy="104" r="9" />
    <path d="M62,121 L86,121 L84,141 L64,141 Z" />
    <line x1="62" y1="124" x2="51" y2="140" />
    <line x1="86" y1="124" x2="72" y2="143" />
    <rect x="55" y="140" width="24" height="4" transform="rotate(-6 67 142)" />
    <path d="M28,150 L120,150 L128,133 L36,133 Z" />
    <path d="M28,150 L28,157 L120,157 L120,150" />
    <g stroke-width="0.6">
      <line x1="58" y1="133" x2="50" y2="150" />
      <line x1="88" y1="133" x2="80" y2="150" />
      <line x1="34" y1="141" x2="124" y2="141" />
    </g>
    <line x1="40" y1="157" x2="40" y2="208" />
    <line x1="108" y1="157" x2="108" y2="208" />
    <line x1="40" y1="190" x2="108" y2="190" />
    <!-- wooden screw press -->
    <rect x="200" y="44" width="90" height="10" />
    <rect x="206" y="54" width="8" height="148" stroke-width="1.6" />
    <rect x="276" y="54" width="8" height="148" stroke-width="1.6" />
    <rect x="200" y="196" width="90" height="9" />
    <rect x="228" y="64" width="34" height="12" />
    <line x1="245" y1="76" x2="245" y2="112" stroke-width="1.6" />
    <g stroke-width="0.7">
      <line x1="240" y1="82" x2="250" y2="80" />
      <line x1="240" y1="89" x2="250" y2="87" />
      <line x1="240" y1="96" x2="250" y2="94" />
      <line x1="240" y1="103" x2="250" y2="101" />
    </g>
    <line x1="245" y1="86" x2="322" y2="72" stroke-width="1.6" />
    <circle cx="324" cy="72" r="4" />
    <line x1="245" y1="112" x2="245" y2="120" />
    <rect x="228" y="120" width="34" height="12" />
    <rect x="222" y="150" width="46" height="12" />
    <line x1="200" y1="150" x2="222" y2="150" stroke-width="1" />
    <line x1="268" y1="150" x2="290" y2="150" stroke-width="1" />
    <!-- rounce wheel -->
    <circle cx="196" cy="170" r="13" />
    <line x1="187" y1="161" x2="205" y2="179" stroke-width="0.9" />
    <line x1="205" y1="161" x2="187" y2="179" stroke-width="0.9" />
    <line x1="186" y1="160" x2="180" y2="152" />
    <circle cx="179" cy="151" r="2.5" />
    <line x1="207" y1="163" x2="222" y2="153" stroke-width="0.9" />
    <!-- press stand legs -->
    <line x1="214" y1="205" x2="214" y2="208" />
    <line x1="276" y1="205" x2="276" y2="208" />
    <!-- pressman pulling the bar -->
    <circle cx="325" cy="104" r="8" />
    <path d="M317,116 L333,116 L331,150 L319,150 Z" />
    <line x1="319" y1="118" x2="318" y2="80" />
    <line x1="318" y1="80" x2="322" y2="74" />
    <line x1="331" y1="120" x2="336" y2="150" />
    <line x1="321" y1="150" x2="315" y2="192" />
    <line x1="329" y1="150" x2="335" y2="192" />
    <!-- ground line and floor shading -->
    <line x1="10" y1="208" x2="334" y2="208" stroke-width="1.4" />
    <g stroke-width="0.5">
      <line x1="40" y1="210" x2="34" y2="218" />
      <line x1="70" y1="210" x2="64" y2="218" />
      <line x1="100" y1="210" x2="94" y2="218" />
      <line x1="214" y1="210" x2="208" y2="218" />
      <line x1="250" y1="210" x2="244" y2="218" />
      <line x1="286" y1="210" x2="280" y2="218" />
    </g>
  </g>
</svg>
