<line x1="60" y1="145" x2="106" y2="145"/><line x1="60" y1="152" x2="106" y2="152"/>
</g>

<rect x="60" y="158" width="46" height="52" fill="#e2ded1" stroke="#1a1a1a" stroke-width="1.2"/>
<g stroke="#62615d" stroke-width="1" stroke-dasharray="7 9">
<line x1="60" y1="167" x2="106" y2="167"/><line x1="60" y1="181" x2="106" y2="181"/>
<line x1="60" y1="196" x2="106" y2="196"/>
</g>

<rect x="60" y="210" width="46" height="60" fill="#cfcabb" stroke="#1a1a1a" stroke-width="1.2"/>

<line x1="52" y1="40" x2="52" y2="270" stroke="#62615d" stroke-width="1"/>
<g stroke="#62615d" stroke-width="1">
<line x1="46" y1="40" x2="52" y2="40"/><line x1="46" y1="158" x2="52" y2="158"/>
<line x1="46" y1="210" x2="52" y2="210"/><line x1="46" y1="270" x2="52" y2="270"/>
</g>
<text class="tick" x="40" y="45" text-anchor="end">0.0</text>
<text class="tick" x="40" y="163" text-anchor="end">4.1</text>
<text class="tick" x="40" y="215" text-anchor="end">5.9</text>
<text class="tick" x="40" y="275" text-anchor="end">11.4</text>
<text class="lbl" x="30" y="22">Depth (m)</text>

<g stroke="#b0ada2" stroke-width="1">
<line x1="106" y1="99" x2="122" y2="99"/>
<line x1="106" y1="185" x2="122" y2="185"/>
<line x1="106" y1="241" x2="122" y2="241"/>
</g>
<text class="key" x="130" y="103">Laminated: paired silt and organic couplets</text>
<text class="key" x="130" y="189">Frayed: burrow mottling, boundaries lost</text>
<text class="key" x="130" y="245">Massive grey clay: no annual structure</text>

<line x1="500" y1="40" x2="500" y2="270" stroke="#62615d" stroke-width="1.2"/>
