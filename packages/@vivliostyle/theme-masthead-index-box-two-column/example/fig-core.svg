<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Schematic of the Ostrand Basin core: a stratigraphic column beside a plot of varve thickness against depth, with the laminated interval, the frayed transition and the massive clay below marked">
