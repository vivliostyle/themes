<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 430" role="img" aria-label="The demand curve shifts to the right, raising the equilibrium price from 2.00 to 2.50 dollars and the quantity from 80 to 100 cups">
  <style>
    text { font-family: "PT Serif", Georgia, "Times New Roman", serif; fill: #1a1a1a; }
