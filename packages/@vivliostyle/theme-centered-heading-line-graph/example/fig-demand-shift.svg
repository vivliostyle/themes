    <line class="tick" x1="140.8" y1="122.2" x2="216.8" y2="122.2" stroke-width="1.4" />
    <path d="M 216.8 122.2 L 197.8 117.7 L 197.8 126.7 Z" fill="#1a1a1a" />

    <text class="sym" x="423.4" y="75.6" font-size="17" fill="#006633">S</text>
    <text class="sym" x="428.1" y="343.9" font-size="17" fill="#b34700">D</text>
    <text class="sym" x="432.9" y="285.6" font-size="17" fill="#b34700">D′</text>
