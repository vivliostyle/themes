<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 205" role="img" aria-label="Bar chart of total revenue at each price, peaking at 160 dollars when the price is 2.00 dollars">
  <style>
    text { font-family: "PT Serif", Georgia, "Times New Roman", serif; fill: #1a1a1a; }
    .sym { font-style: italic; }
    .axis { stroke: #1a1a1a; stroke-width: 1.2; }
    .tick { stroke: #1a1a1a; stroke-width: 1; }
    .guide { stroke: #1a1a1a; stroke-width: 1; stroke-dasharray: 4 3; }
    .supply { stroke: #006633; fill: none; stroke-width: 2.4; }
    .demand { stroke: #b34700; fill: none; stroke-width: 2.4; }
  </style>

    <text x="4" y="11" font-size="11">Total revenue (dollars)</text>
    <line class="axis" x1="46" y1="18" x2="46" y2="168" />
    <line class="axis" x1="46" y1="168" x2="404" y2="168" />
    <line class="axis" x1="42" y1="168" x2="46" y2="168" />
    <text x="39" y="171.5" font-size="11" text-anchor="end">0</text>
    <line class="axis" x1="42" y1="130.5" x2="46" y2="130.5" />
    <text x="39" y="134" font-size="11" text-anchor="end">50</text>
    <line class="axis" x1="42" y1="93" x2="46" y2="93" />
    <text x="39" y="96.5" font-size="11" text-anchor="end">100</text>
    <line class="axis" x1="42" y1="55.5" x2="46" y2="55.5" />
    <text x="39" y="59" font-size="11" text-anchor="end">150</text>
    <line class="axis" x1="42" y1="18" x2="46" y2="18" />
    <text x="39" y="21.5" font-size="11" text-anchor="end">200</text>

    <rect x="58.8" y="78" width="34" height="90" fill="#e8f0e8" stroke="#006633" stroke-width="1.2" />
    <text x="75.8" y="74" font-size="10.5" text-anchor="middle">120</text>
    <text x="75.8" y="182" font-size="11" text-anchor="middle">1.00</text>
    <rect x="118.5" y="55.5" width="34" height="112.5" fill="#e8f0e8" stroke="#006633" stroke-width="1.2" />
    <text x="135.5" y="51.5" font-size="10.5" text-anchor="middle">150</text>
    <text x="135.5" y="182" font-size="11" text-anchor="middle">1.50</text>
    <rect x="178.2" y="48" width="34" height="120" fill="#006633" stroke="#006633" stroke-width="1.2" />
    <text x="195.2" y="44" font-size="10.5" text-anchor="middle">160</text>
    <text x="195.2" y="182" font-size="11" text-anchor="middle">2.00</text>
    <rect x="237.8" y="55.5" width="34" height="112.5" fill="#e8f0e8" stroke="#006633" stroke-width="1.2" />
    <text x="254.8" y="51.5" font-size="10.5" text-anchor="middle">150</text>
    <text x="254.8" y="182" font-size="11" text-anchor="middle">2.50</text>
    <rect x="297.5" y="78" width="34" height="90" fill="#e8f0e8" stroke="#006633" stroke-width="1.2" />
    <text x="314.5" y="74" font-size="10.5" text-anchor="middle">120</text>
    <text x="314.5" y="182" font-size="11" text-anchor="middle">3.00</text>
    <rect x="357.2" y="115.5" width="34" height="52.5" fill="#e8f0e8" stroke="#006633" stroke-width="1.2" />
    <text x="374.2" y="111.5" font-size="10.5" text-anchor="middle">70</text>
    <text x="374.2" y="182" font-size="11" text-anchor="middle">3.50</text>

    <text x="195.2" y="29" font-size="10.5" text-anchor="middle" fill="#b34700">unit elastic</text>
    <text x="225" y="198" font-size="11" text-anchor="middle">Price (dollars per cup)</text>
