<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-label="Line chart of coffee and tea prices, 2017 to 2023">
  <style>
    text { font-family: "PT Serif", Georgia, "Times New Roman", serif; fill: #1a1a1a; }
    .axis { stroke: #1a1a1a; stroke-width: 1; }
    .coffee { stroke: #006633; fill: none; stroke-width: 1.8; }
    .tea { stroke: #b34700; fill: none; stroke-width: 1.8; }
    .dot-coffee { fill: #006633; }
    .dot-tea { fill: #b34700; }
  </style>

  <text x="4" y="11" font-size="11">Price (dollars per cup)</text>

  <line class="axis" x1="46" y1="18" x2="46" y2="168" />
  <line class="axis" x1="46" y1="168" x2="404" y2="168" />
  <line class="axis" x1="42" y1="168" x2="46" y2="168" />
  <line class="axis" x1="42" y1="138" x2="46" y2="138" />
  <line class="axis" x1="42" y1="108" x2="46" y2="108" />
  <line class="axis" x1="42" y1="78" x2="46" y2="78" />
  <line class="axis" x1="42" y1="48" x2="46" y2="48" />
  <line class="axis" x1="42" y1="18" x2="46" y2="18" />
  <text x="39" y="171" font-size="11" text-anchor="end">0.00</text>
  <text x="39" y="141" font-size="11" text-anchor="end">0.50</text>
  <text x="39" y="111" font-size="11" text-anchor="end">1.00</text>
  <text x="39" y="81" font-size="11" text-anchor="end">1.50</text>
  <text x="39" y="51" font-size="11" text-anchor="end">2.00</text>
  <text x="39" y="21" font-size="11" text-anchor="end">2.50</text>

  <line class="axis" x1="46" y1="168" x2="46" y2="172" />
  <line class="axis" x1="105.7" y1="168" x2="105.7" y2="172" />
  <line class="axis" x1="165.3" y1="168" x2="165.3" y2="172" />
  <line class="axis" x1="225" y1="168" x2="225" y2="172" />
  <line class="axis" x1="284.7" y1="168" x2="284.7" y2="172" />
  <line class="axis" x1="344.3" y1="168" x2="344.3" y2="172" />
  <line class="axis" x1="404" y1="168" x2="404" y2="172" />
  <text x="46" y="183" font-size="11" text-anchor="middle">2017</text>
  <text x="105.7" y="183" font-size="11" text-anchor="middle">2018</text>
  <text x="165.3" y="183" font-size="11" text-anchor="middle">2019</text>
  <text x="225" y="183" font-size="11" text-anchor="middle">2020</text>
  <text x="284.7" y="183" font-size="11" text-anchor="middle">2021</text>
  <text x="344.3" y="183" font-size="11" text-anchor="middle">2022</text>
  <text x="404" y="183" font-size="11" text-anchor="middle">2023</text>
  <text x="225" y="197" font-size="11" text-anchor="middle">Year</text>

  <polyline class="coffee" points="46,102 105.7,99 165.3,96 225,84 284.7,75 344.3,63 404,48" />
  <circle class="dot-coffee" cx="46" cy="102" r="3" />
  <circle class="dot-coffee" cx="105.7" cy="99" r="3" />
  <circle class="dot-coffee" cx="165.3" cy="96" r="3" />
  <circle class="dot-coffee" cx="225" cy="84" r="3" />
  <circle class="dot-coffee" cx="284.7" cy="75" r="3" />
  <circle class="dot-coffee" cx="344.3" cy="63" r="3" />
  <circle class="dot-coffee" cx="404" cy="48" r="3" />

  <polyline class="tea" points="46,129 105.7,127.2 165.3,124.8 225,123 284.7,121.2 344.3,117 404,111" />
  <circle class="dot-tea" cx="46" cy="129" r="3" />
  <circle class="dot-tea" cx="105.7" cy="127.2" r="3" />
  <circle class="dot-tea" cx="165.3" cy="124.8" r="3" />
  <circle class="dot-tea" cx="225" cy="123" r="3" />
  <circle class="dot-tea" cx="284.7" cy="121.2" r="3" />
  <circle class="dot-tea" cx="344.3" cy="117" r="3" />
  <circle class="dot-tea" cx="404" cy="111" r="3" />

  <line class="coffee" x1="140" y1="212" x2="164" y2="212" />
  <circle class="dot-coffee" cx="152" cy="212" r="3" />
  <text x="169" y="215.5" font-size="11">Coffee</text>
  <line class="tea" x1="222" y1="212" x2="246" y2="212" />
  <circle class="dot-tea" cx="234" cy="212" r="3" />
  <text x="251" y="215.5" font-size="11">Tea</text>
</svg>
