<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 184" role="img" aria-label="測定系のブロック図。信号発生器から基準パワーアンプを経て被測定機へ信号が送られ、無響室内で軸上1.0メートルに立てた計測マイクが音圧を拾う。マイクアンプ、24bit/96kHzのA/D変換器を経てFFTアナライザに入る。被測定機は回転台に載せ0度・15度・30度で測定する。">
<style>
.box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 0.9; }
.room { fill: none; stroke: #1a1a1a; stroke-width: 0.7; stroke-dasharray: 5 3.2; }
.wire { fill: none; stroke: #1a1a1a; stroke-width: 0.9; }
.mic { fill: #ffffff; stroke: #1a1a1a; stroke-width: 0.9; }
.lab { font-family: "Noto Sans JP", sans-serif; font-weight: 400; font-size: 13px; fill: #1a1a1a; text-anchor: middle; }
.sub { font-family: "Noto Sans JP", sans-serif; font-weight: 400; font-size: 11px; fill: #1a1a1a; text-anchor: middle; }
.num { font-family: "IBM Plex Mono", monospace; font-size: 12px; fill: #1a1a1a; text-anchor: middle; }
.roomlab { font-family: "Noto Sans JP", sans-serif; font-weight: 500; font-size: 11.5px; fill: #1a1a1a; letter-spacing: 0.08em; }
</style>
<defs>
<marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="5.6" orient="auto">
<path d="M0,0 L10,4 L0,8 z" fill="#1a1a1a" />
</marker>
</defs>

<rect class="room" x="366" y="18" width="270" height="100" rx="3" />
<text class="roomlab" x="374" y="33">無響室</text>

<rect class="box" x="20" y="48" width="136" height="40" rx="3" />
<text class="lab" x="88" y="73">信号発生器</text>

<rect class="box" x="196" y="48" width="150" height="40" rx="3" />
<text class="lab" x="271" y="73">基準パワーアンプ</text>

<rect class="box" x="386" y="48" width="130" height="40" rx="3" />
<text class="lab" x="451" y="73">被測定機</text>
<text class="sub" x="451" y="107">回転台 0°/15°/30°</text>

<line class="wire" x1="156" y1="68" x2="190" y2="68" marker-end="url(#ar)" />
<line class="wire" x1="346" y1="68" x2="380" y2="68" marker-end="url(#ar)" />
<line class="wire" x1="516" y1="68" x2="584" y2="68" marker-end="url(#ar)" />
<text class="num" x="550" y="60">1.0 m</text>

<text class="sub" x="600" y="45">計測マイク</text>
<rect class="mic" x="592" y="55" width="16" height="26" rx="8" />
<line class="wire" x1="600" y1="81" x2="600" y2="94" />
<line class="wire" x1="590" y1="94" x2="610" y2="94" />
<line class="wire" x1="600" y1="94" x2="600" y2="124" marker-end="url(#ar)" />

<rect class="box" x="520" y="128" width="136" height="40" rx="3" />
<text class="lab" x="588" y="153">マイクアンプ</text>

<rect class="box" x="330" y="128" width="160" height="40" rx="3" />
<text class="lab" x="410" y="153">A/D 24bit/96kHz</text>

<rect class="box" x="100" y="128" width="190" height="40" rx="3" />
<text class="lab" x="195" y="153">FFT アナライザ</text>

<line class="wire" x1="520" y1="148" x2="496" y2="148" marker-end="url(#ar)" />
<line class="wire" x1="330" y1="148" x2="296" y2="148" marker-end="url(#ar)" />
</svg>
