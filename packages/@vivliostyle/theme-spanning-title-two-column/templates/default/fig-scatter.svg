    .axis { stroke: #1a1a1a; stroke-width: 1.2; }
    .tick { stroke: #1a1a1a; stroke-width: 1; }
    .fit { fill: none; stroke: #1a1a1a; stroke-width: 1.1; stroke-dasharray: 6 4; }
    .dot { fill: none; stroke: #1a1a1a; stroke-width: 1.1; }
  </style>

