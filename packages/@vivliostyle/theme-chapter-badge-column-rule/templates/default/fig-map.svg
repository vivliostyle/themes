<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 264" role="img" aria-label="ヴェルミリオ旧市街の略地図。運河・広場・主要スポットの位置を番号ピンで示す。">
<style>
.m-base { fill: #e7dcc4; }
